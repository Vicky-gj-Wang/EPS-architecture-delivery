  <script src="eps-topic-shell.js?v=20260526-04"></script>
  <script>
    (function () {
      function enforceFullVisible() {
        const svg = document.getElementById("diagramSvg");
        if (!svg) return;

        svg.querySelectorAll("[data-mode]").forEach((n) => {
          n.removeAttribute("data-mode");
          n.style.opacity = "1";
        });

        const mode = document.getElementById("modeFilter");
        if (mode) {
          mode.value = "all";
          mode.disabled = true;
          mode.title = "该专题固定展示全部节点，避免浏览器缓存导致筛选异常。";
        }
      }

      window.addEventListener("load", () => {
        enforceFullVisible();
        setTimeout(enforceFullVisible, 120);
        setTimeout(enforceFullVisible, 500);
        setTimeout(enforceFullVisible, 1500);
        const guard = setInterval(enforceFullVisible, 500);
        setTimeout(() => clearInterval(guard), 20000);
      });

      const svg = document.getElementById("diagramSvg");
      if (svg && typeof MutationObserver !== "undefined") {
        new MutationObserver(() => enforceFullVisible()).observe(svg, { childList: true, subtree: true });
      }
    })();
  </script>
